title: "競馬AIは市場に勝てるのか — 18,777レースで検証して負けた話"
summary: "LightGBMと2020〜2026年のレースデータで競馬予測AIを作り、バックテストでROI 177%を叩き出し、そして全てが幻だと自分で証明するまでの記録。データリーク、multiple testing、市場データの汚染、後知恵バイアス — MLプロジェクトを殺す4つの罠を実データで踏み抜き、最後にパリミュチュエル市場の効率性を18万頭分の実測で確認した。勝ちたい人には残念な、しかし機械学習の検証を仕事にする人には役立つ話。"
